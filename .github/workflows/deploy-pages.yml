name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

concurrency:
  group: cf-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site artifact
        run: |
          mkdir -p /tmp/site
          rsync -a \
            --exclude local \
            --exclude .git \
            --exclude .github \
            --exclude PROMPTS \
            --exclude scripts \
            --exclude node_modules \
            --exclude .wrangler \
            ./ /tmp/site/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: f480ee9a20c8270499364bf5fbb05de6
          command: pages deploy /tmp/site --project-name=muzhskoy-psikholog-ru
