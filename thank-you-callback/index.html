<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Заявка отправлена</title>
  <meta name="description" content="Заявка отправлена. Психолог Анна Щеголихина свяжется с вами в течение дня." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://anna-psy.online/thank-you-callback/" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="/assets/site.css?v=20260807audit" />
</head>
<body>
<header class="site-header">
    <div class="wrap"><a class="brand" href="/">Психолог Анна Щеголихина</a></div>
  </header>
  <main class="page-hero">
    <div class="thank-card thank-card-wide" id="thankYouContent">
      <h1>Спасибо!</h1>
      <p class="thank-lead">Заявка принята. Загрузка…</p>
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <div>© Щеголихина А. М.</div>
      <nav><a href="/privacy/">Конфиденциальность</a><a href="/oferta/">Оферта</a><a href="#" class="js-cookie-settings">Настройки cookie</a></nav>
    </div>
  </footer>
  <script>
    (function () {
      var CONTACT = { telegram: 'Telegram', whatsapp: 'WhatsApp', max: 'MAX', sms: 'SMS' };
      var MAX_URL = 'https://max.ru/u/f9LHodD0cOKrHIa3XdZycCKQSXXx0dFf9Ck7hXPtx3Ti-6RSxFnoPC7d1Ag';

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function displayPhone(phone) {
        var digits = String(phone || '').replace(/\D/g, '');
        if (digits.charAt(0) === '8') digits = '7' + digits.slice(1);
        if (digits.length === 10) digits = '7' + digits;
        if (digits.length !== 11 || digits.charAt(0) !== '7') {
          return String(phone || '').trim();
        }
        return (
          '+7 ' +
          digits.slice(1, 4) +
          ' ' +
          digits.slice(4, 7) +
          '-' +
          digits.slice(7, 9) +
          '-' +
          digits.slice(9, 11)
        );
      }

      function formatContact(methods) {
        var list = (Array.isArray(methods) ? methods : [])
          .map(function (m) {
            var key = String(m || '').toLowerCase();
            return CONTACT[key] || String(m || '').trim();
          })
          .filter(Boolean);
        if (!list.length) return '';
        if (list.length === 1) return list[0];
        if (list.length === 2) return list[0] + ' или ' + list[1];
        return list.slice(0, -1).join(', ') + ' или ' + list[list.length - 1];
      }

      function row(label, value) {
        if (!value) return '';
        return (
          '<div class="thank-row"><span>' +
          escapeHtml(label) +
          '</span><strong>' +
          value +
          '</strong></div>'
        );
      }

      var root = document.getElementById('thankYouContent');
      var raw = null;
      try {
        raw = sessionStorage.getItem('callbackThankYou');
        sessionStorage.removeItem('callbackThankYou');
      } catch (e) {}

      var messengerLinks =
        '<span class="thank-messengers">' +
        '<a href="https://t.me/annashhe" target="_blank" rel="noopener">Telegram</a>' +
        '<a href="https://wa.me/79137556284" target="_blank" rel="noopener">WhatsApp</a>' +
        '<a href="' + MAX_URL + '" target="_blank" rel="noopener">MAX</a>' +
        '</span>';

      function layout(opts) {
        return (
          '<h1>' + opts.title + '</h1>' +
          '<p class="thank-lead">' + opts.lead + '</p>' +
          (opts.details || '') +
          '<div class="thank-footer">' +
          '<p class="thank-note">Если вопрос срочный — напишите напрямую:</p>' +
          messengerLinks +
          '<a class="btn btn-primary thank-cta" href="/">Вернуться на сайт</a>' +
          '</div>'
        );
      }

      if (!raw) {
        root.innerHTML = layout({
          title: 'Спасибо!',
          lead: 'Если вы только что отправили заявку, я скоро свяжусь с вами.',
          details: ''
        });
        return;
      }

      var data = {};
      try {
        data = JSON.parse(raw);
      } catch (e) {
        data = {};
      }

      var name = escapeHtml(data.name || '');
      var via = formatContact(data.contactMethods);
      var phone = displayPhone(data.phone);
      var details =
        '<div class="thank-details">' +
        row('Телефон', phone ? escapeHtml(phone) : '') +
        row('Способ связи', via ? escapeHtml(via) : '') +
        row('Комментарий', data.comment ? escapeHtml(data.comment) : '') +
        '</div>';
      if (!phone && !via && !data.comment) details = '';

      root.innerHTML = layout({
        title: name ? 'Спасибо, ' + name + '!' : 'Спасибо!',
        lead: 'Я получила вашу заявку и свяжусь с вами в течение дня.',
        details: details
      });
    })();
  </script>
    <script src="/assets/cookie-notice.js?v=20260807c" defer></script>
  <script src="/assets/consent-analytics.js?v=20260807c" defer></script>
  <script src="/assets/site.js?v=20260807c" defer></script>
</body>
</html>
