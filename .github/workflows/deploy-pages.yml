name: Deploy to GitHub Pages

# Static site deploy via Actions (preferred while legacy builder is stuck).
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy-v3
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare publish directory
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          # Copy only what GitHub Pages should serve (no .git / workflows / docs).
          tar -cf - \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./_site' \
            --exclude='./local' \
            --exclude='./PROMPTS' \
            --exclude='./scripts' \
            --exclude='./.gitignore' \
            --exclude='./HOSTING-DNS.md' \
            --exclude='./CUTOVER.md' \
            --exclude='./REDIRECTS.md' \
            --exclude='./DESIGN-FROM-TILDA.md' \
            . | tar -xf - -C _site
          test -f _site/index.html
          test -f _site/about/index.html
          test -f _site/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

