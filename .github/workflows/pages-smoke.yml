name: Pages status

# Verifies the live custom domain responds after push (optional smoke).
# Deploy itself is handled by "Deploy to GitHub Pages".

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages
        run: sleep 45
      - name: Check homepage
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/home.html -w "%{http_code}" https://anna-psy.online/)
          echo "HTTP $code"
          test "$code" = "200"
          grep -q 'site.js' /tmp/home.html
          grep -q 'Анна' /tmp/home.html || grep -q 'anna' /tmp/home.html
      - name: Check HTTPS redirect from HTTP
        run: |
          set -euo pipefail
          loc=$(curl -sS -o /dev/null -w "%{redirect_url}" http://anna-psy.online/ || true)
          echo "Redirect: $loc"
          echo "$loc" | grep -q 'https://anna-psy.online'
