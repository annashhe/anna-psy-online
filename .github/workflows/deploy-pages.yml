name: Deploy to GitHub Pages

# Static site → GitHub Pages (not Cloudflare). Cloudflare DNS may still
# point at these IPs with grey-cloud (DNS only) records.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy-v4
  # New push cancels a stuck/previous deploy so "in progress" cannot block the queue forever.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare publish directory
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          tar -cf - \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./_site' \
            --exclude='./local' \
            --exclude='./PROMPTS' \
            --exclude='./scripts' \
            --exclude='./node_modules' \
            --exclude='./.wrangler' \
            --exclude='./.gitignore' \
            --exclude='./HOSTING-DNS.md' \
            --exclude='./CUTOVER.md' \
            --exclude='./REDIRECTS.md' \
            --exclude='./DESIGN-FROM-TILDA.md' \
            --exclude='./.cfignore' \
            . | tar -xf - -C _site
          test -f _site/index.html
          test -f _site/about/index.html
          test -f _site/vopros-psikhologu/index.html
          test -f _site/CNAME
          test -f _site/assets/site.css
          test -f _site/assets/site.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
